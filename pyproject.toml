[project]
name = "sqec-paper-figures"
version = "1.0.0"
description = "Data and notebook to regenerate the data figures of arXiv:2611.02972 (Towards Optimal Routing Strategies for qLDPC codes on Silicon Spin Qubits)."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    # Libraries the notebook imports. Versions match the environment that made the paper figures.
    "matplotlib==3.10.8",
    "numpy==2.2.6",
    # pandas 3 changes the legend colors of the initial layout figures. Keep pandas 2.x.
    "pandas==2.3.3",
    "seaborn==0.13.2",
    # Jupyter tooling to open and execute the notebook.
    "ipykernel",
    "jupyterlab",
    "nbconvert",
]

[tool.uv]
package = false
